# Development dependencies for the api service. Currently only PostgreSQL.
# Usage: docker compose up -d   (values are read from ./.env when present)
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      POSTGRES_USER: ${DATABASE_USERNAME:-auth}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-auth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep the cluster in a major-version subdirectory, so the mount
      # belongs at /var/lib/postgresql; mounting /var/lib/postgresql/data makes them refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Lets "docker compose up --wait" (and dependent services later) block until the
      # database actually accepts connections, not just until the container starts.
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-auth} -d ${POSTGRES_DB:-auth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
