<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Đổi mật khẩu</title>
	<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<h1>Đổi mật khẩu</h1>

<p>
	<a href="account.html">Thông tin tài khoản</a>
</p>

<form id="password-form">
	<label>
		Mật khẩu hiện tại
		<input id="current-password" type="password" autocomplete="current-password" required>
	</label>
	<label>
		Mật khẩu mới
		<input id="new-password" type="password" autocomplete="new-password" required>
	</label>
	<button id="password-submit" type="submit">Đổi mật khẩu</button>
</form>

<p id="password-message" class="message" role="alert"></p>

<script src="js/api.js"></script>
<script>
	'use strict';

	const passwordMessage = document.getElementById('password-message');
	const passwordForm = document.getElementById('password-form');
	const passwordSubmit = document.getElementById('password-submit');

	passwordForm.addEventListener('submit', async function (event) {
		event.preventDefault();
		passwordMessage.textContent = '';
		passwordMessage.className = 'message';
		passwordSubmit.disabled = true;

		const change = {
			currentPassword: document.getElementById('current-password').value,
			newPassword: document.getElementById('new-password').value
		};

		try {
			await Api.request('/api/users/me/password', {
				method: 'PUT',
				body: JSON.stringify(change)
			});
			passwordMessage.className = 'message ok';
			passwordMessage.textContent = 'Đã đổi mật khẩu.';
			// Clears both password fields, so a plaintext password is not left in the DOM after
			// it has been accepted.
			passwordForm.reset();
		}
		catch (error) {
			passwordMessage.className = 'message error';
			passwordMessage.textContent = error.code + ': ' + error.message;
		}
		finally {
			passwordSubmit.disabled = false;
		}
	});

	// No GET /api/users/me here: this page displays no account data, so the only thing it needs
	// is a token to send. Whether the account may change its password stays a server decision —
	// PUT /api/users/me/password answers 403 without PASSWORD_CHANGE.
	Api.requireAccessToken();
</script>
</body>
</html>
